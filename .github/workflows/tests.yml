name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Install official MOPAC and test real calculations
        if: matrix.python == '3.11'
        env:
          RUN_MOPAC_INTEGRATION: '1'
        run: |
          python engine_setup.py
          python -m unittest discover -s tests -p test_mopac_integration.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check static/js/app.js
      - run: node --check static/js/editor.js
